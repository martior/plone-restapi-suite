[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restapi-suite"
version = "0.1.0"
description = "Backend-agnostic black-box test suite for the plone.restapi HTTP API (Plone 6.2 reference, Nick, ...)"
requires-python = ">=3.11"
license = "GPL-2.0-only"
license-files = ["LICENSE.md", "LICENSE.GPL"]
dependencies = ["pytest>=8", "pytest-xdist>=3", "httpx>=0.27"]

[project.scripts]
restapi-suite-report = "restapi_suite.report:main"

[tool.setuptools]
packages = ["restapi_suite"]

[tool.setuptools.package-data]
restapi_suite = ["*.json", "*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p restapi_suite.plugin -ra"
markers = [
  "known_divergence(target, reason, ref=None, kind='bug', ids=None): expected failure on TARGET (target name or kind glob, e.g. nick or plone); xfail(strict=False)",
  "compat(reason): asserts Plone behaviour that is arguably wrong but clients depend on ('why; evidence'); reported as its own category",
  "target_only(*targets, reason=None): test applies only to TARGETS (name or kind globs); skipped elsewhere, reported as its own category",
  "plone_bug(reason): legacy informational note (no longer used by the suite); shown in the report",
  "requires(*features): skip unless the target declares all FEATURES in targets.toml",
  "area(name): service area for the report (default: test module name)",
  "migration: Plone to Nick migration round trip; needs MIGRATION_SOURCE_URL and MIGRATION_TARGET_URL (tests/test_migration_roundtrip.py)",
  "workflow_matrix: state x transition x role matrix of the standard Plone workflows; needs WORKFLOW_MATRIX_URL (tests/test_workflow_matrix.py)",
]
